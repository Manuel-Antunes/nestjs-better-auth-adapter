name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:dist

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [express, fastify]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test:${{ matrix.adapter }}

  # The example app, built against this package's dist, on a real Postgres and Redis.
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [express, fastify]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U acme -d acme_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
        working-directory: example
      - run: bun run build
        working-directory: example
      - run: bun run test:${{ matrix.adapter }}
        working-directory: example

name: Release

# Publishes to npm when a `v*` tag is pushed, then creates the GitHub release:
# the tagged `chore(release): x.y.z` commit's message, followed by the pull
# requests GitHub lists since the previous tag.
#
# One-time setup on npmjs.com: the package's Settings → Trusted publishing →
# GitHub Actions, repository `Manuel-Antunes/nestjs-better-auth-adapter`,
# workflow `release.yaml`. No token is stored in the repository.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # the OIDC token npm trusted publishing exchanges, and the provenance statement

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No `cache:` — a release build never restores one.
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1.
      - name: Use an npm that can publish through OIDC
        run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      # What CI checks, again on the tagged commit: the example app, which
      # needs Postgres and Redis, stays CI's.
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:dist

      - name: Read the release notes out of the release commit
        run: |
          # The tagged commit's body, without its co-author trailers.
          git log -1 --format=%b "$GITHUB_SHA" \
            | sed '/^Co-Authored-By: /Id' > "$RUNNER_TEMP/release-notes.md"

      # A prerelease version (1.0.0-rc.1) is published under the `next`
      # dist-tag, never `latest`. A version already on npm (published by hand
      # before trusted publishing was configured) is not published again; the
      # release is still created.
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${GITHUB_REF_NAME#v}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — skipping publish."
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *)   npm publish --provenance --access public ;;
          esac

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving its notes as they are."
            exit 0
          fi
          prerelease="--latest"
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            $prerelease
